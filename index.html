<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CELPIP Practice Test</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" onclick="Router.go('home')">CELPIP Practice Test</div>
    <nav>
      <a onclick="Router.go('home')">Home</a>
      <a onclick="Router.go('listening')">Listening</a>
      <a onclick="Router.go('reading')">Reading</a>
      <a onclick="Router.go('writing')">Writing</a>
      <a onclick="Router.go('speaking')">Speaking</a>
      <a onclick="Router.go('answer-key')">Answer Key</a>
      <span id="testSelectContainer" class="test-select-wrap"></span>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="app-footer">
    Unofficial, independent practice tool. Not affiliated with or endorsed by CELPIP / Paragon Testing Enterprises.
  </footer>

  <!-- Data: each test file pushes itself into window.__<skill>Tests; aggregate.js then sorts them -->
  <script src="js/data/listening/test01.js"></script>
  <script src="js/data/reading/test01.js"></script>
  <script src="js/data/writing/test01.js"></script>
  <script src="js/data/speaking/test01.js"></script>
  <script src="js/data/aggregate.js"></script>

  <!-- Utilities -->
  <script src="js/timer.js"></script>
  <script src="js/timerWidget.js"></script>

  <!-- App shell / router (defines helpers used by section controllers) -->
  <script src="js/app.js"></script>

  <!-- Section controllers -->
  <script src="js/sections/listening.js"></script>
  <script src="js/sections/reading.js"></script>
  <script src="js/sections/writing.js"></script>
  <script src="js/sections/speaking.js"></script>
  <script src="js/answerkey.js"></script>
</body>
</html>
